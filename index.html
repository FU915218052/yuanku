<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>软件库</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-body);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    :root {
      --bg-body: #f5f8fa;
      --bg-card: #f9f9f9;
      --bg-panel: #ffffff;
      --text-main: #333;
      --text-second: #888;
      --border-color: #eee;
      --shadow-color: rgba(0,0,0,0.05);
      --primary: #2196F3;
      --danger: #e63946;
      color-scheme: light;
    }

    html.dark-mode {
      --bg-body: #121111;
      --bg-card: #1e1e1e;
      --bg-panel: #1f1f1e;
      --text-main: #e5e5e5;
      --text-second: #aaa;
      --border-color: #333;
      --shadow-color: rgba(0,0,0,0.3);
      color-scheme: dark;
    }

    html,
    body {
      background: var(--bg-body);
      min-height: 100vh;
      color: var(--text-main);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .modal-body::-webkit-scrollbar {
      width: 5px;
    }
    .modal-body::-webkit-scrollbar-track {
      background: transparent;
      margin-top: 0;
    }
    html.dark-mode .modal-body::-webkit-scrollbar-thumb {
      background: #ccc;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: var(--bg-panel);
      z-index: 9999;
      box-shadow: 0 1px 6px var(--shadow-color);
      padding: 12px 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 400px;
    }
    .search-box {
      width: 100%;
      height: 32px;
      padding: 0 12px;
      padding-right: 30px;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      background: var(--bg-card);
      color: var(--text-main);
      outline: none;
      autocomplete: off;
    }
    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #999;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
    }
    .search-clear.show {
      display: flex;
    }

    .edit-btn, .theme-btn, .export-btn {
      padding: 8px 16px;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    .edit-btn { background: #999; }
    .edit-btn:hover { background: var(--danger); }

    .theme-btn { background: #666; }
    .theme-btn:hover { background: #444; }

    .export-btn { background: #009688; }
    .export-btn:hover { background: #00796b; }

    .nav-menu {
      width: 160px;
      background: var(--bg-panel);
      border-radius: 16px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100vh - 76px);
      position: fixed;
      top: 76px;
      left: calc(50% - 540px - 160px - 20px);
      overflow-y: auto;
      z-index: 999;
      box-shadow: 0 0 10px var(--shadow-color);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      padding-right: 40px;
      border-radius: 6px;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: 0.2s;
      position: relative;
    }

    .nav-item.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .nav-item:hover:not(.active) { background: var(--border-color); }

    .drag-handle {
      cursor: grab;
      color: var(--text-second);
      user-select: none;
      padding: 0 4px;
      display: none;
    }
    body.edit-mode .drag-handle { display: inline-block; }

    .nav-ctrl {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    body.edit-mode .nav-item:hover .nav-ctrl {
      opacity: 1;
      pointer-events: auto;
    }
    .nav-ctrl button {
      font-size: 10px;
      padding: 1px 4px;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      background: var(--bg-panel);
      color: var(--text-main);
      cursor: pointer;
      line-height: 1.2;
    }
    .nav-ctrl button:hover { background: var(--border-color); }

    .content-wrapper {
      width: 1080px;
      margin: 76px auto 0;
      padding: 25px;
      background: var(--bg-panel);
      border-radius: 20px;
      box-shadow: 0 0 12px var(--shadow-color);
    }

    .content {
      display: grid;
      grid-template-columns: 247px 247px 247px 247px;
      gap: 18px;
    }

    .category-title {
      font-size: 20px;
      font-weight: bold;
      margin: 30px 0 15px;
      padding-left: 10px;
      border-left: 4px solid var(--primary);
    }
    .category-title:first-child { margin-top: 0; }

    .card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      border: 1px solid var(--border-color);
      position: relative;
      display: flex;
      flex-direction: column;
      z-index: 1;
      width: 100%;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 16px var(--shadow-color);
      z-index: 10;
    }

    .card.active { border: 2px solid var(--primary); }

    .card .drag-handle {
      position: absolute;
      left: 6px;
      top: 6px;
      font-size: 16px;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .name {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .desc {
      font-size: 12px;
      color: var(--text-second);
      margin-bottom: 8px;
      word-break: break-all;
      white-space: normal;
    }
    .desc:empty { display: none; margin: 0; }

    .link-wrap {
      position: relative;
      display: inline-block;
      z-index: 9999;
      width: 100%;
    }
    .link:empty { display: none; }
    .link {
      font-size: 12px;
      color: var(--primary);
      cursor: pointer;
      word-break: break-all;
      white-space: normal;
      display: inline-block;
      width: 100%;
    }
    .copy-btn {
      position: absolute;
      right: -55px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      padding: 2px 6px;
      background: #333;
      color: #fff;
      border-radius: 3px;
      display: none;
      z-index: 99999 !important;
      pointer-events: auto;
      white-space: nowrap;
    }
    .link-wrap:hover .copy-btn { display: block; }

    .edit-ctrl {
      display: none;
      margin-top: 5px;
      gap: 5;
      justify-content: center;
    }
    body.edit-mode .edit-ctrl { display: flex; }
    .edit-ctrl button {
      font-size: 12px;
      padding: 2px 6px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      background: var(--border-color);
      color: var(--text-main);
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }

    .modal-box {
      background: var(--bg-panel);
      color: var(--text-main);
      width: 800px;
      max-height: 85vh;
      border-radius: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      position: relative;
      padding: 15px 50px;
      flex-shrink: 0;
      z-index: 1000;
      background: var(--bg-panel);
    }

    .close {
      position: absolute;
      right: 15px;
      top: 15px;
      width: 30px;
      height: 30px;
      background: #999;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 999999 !important;
      pointer-events: all;
    }
    .close:hover { background: var(--danger); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 0 30px 30px 30px;
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-panel);
      padding-top: 10px;
    }
    .detail-header img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .detail-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    #detailTitle {
      margin: 0;
      padding: 0;
      line-height: 1;
      font-size: 22px;
      font-weight: bold;
    }
    .detail-desc {
      font-size: 14px;
      color: var(--text-second);
      margin: 8px 0 6px 0;
      text-align: left;
    }
    .detail-link-wrap {
      position: relative;
      display: inline-block;
      text-align: left;
    }
    .detail-link {
      font-size: 14px;
      color: var(--primary);
      cursor: pointer;
      word-break: break-all;
    }
    .detail-copy-btn {
      position: absolute;
      right: -60px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      padding: 2px 6px;
      background: #333;
      color: #fff;
      border-radius: 3px;
      display: none;
      white-space: nowrap;
    }
    .detail-link-wrap:hover .detail-copy-btn {
      display: block;
    }

    .detail-content {
      line-height: 1.8;
      font-size: 15px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top:10px;
    }
    .save-btn { background: var(--primary); color: #fff; padding: 6px 14px; border: none; border-radius: 4px; }
    .cancel-btn { background: #999; color: #fff; padding: 6px 14px; border: none; border-radius: 4px; }
    
    .detail-editor-wrapper {
      display: flex;
      flex-direction: column;
      height: 70vh;
      max-height: 700px;
    }
    .detail-editor-header {
      flex-shrink: 0;
      padding: 10px 0;
      background: var(--bg-panel);
      z-index: 10;
    }
    .detail-editor-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }
    .detail-editor-footer {
      flex-shrink: 0;
      padding: 15px 0;
      background: var(--bg-panel);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .editor-area {
      border: 1px solid var(--border-color);
      min-height: 300px;
      padding: 15px;
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-main);
      position: relative;
    }
    .drag-over { border: 2px dashed var(--primary) !important; }

    .alert-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999999;
    }
    .alert-box {
      background: var(--bg-panel);
      color: var(--text-main);
      padding: 25px 35px;
      border-radius: 10px;
      text-align: center;
    }
    .alert-box p {
      margin-bottom: 15px;
      font-size: 15px;
    }
    .alert-box button {
      padding: 6px 18px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background: var(--bg-card);
      color: var(--text-main);
    }
    .upload-tip {
      font-size: 13px;
      color: var(--text-second);
      margin-bottom: 8px;
    }
    h3, h4 { margin-bottom: 15px; }

    .card.hide { display: none; }
    .content-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 0;
      color: var(--text-second);
      font-size: 14px;
    }

    .img-upload-area {
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #imgUpload {
      padding: 6px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-card);
    }
    #imgPreview {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .editor-img-active {
      outline: 2px solid #2196F3 !important;
      cursor: move !important;
    }
    .img-resizer {
      position: absolute;
      border: 2px solid #2196F3;
      pointer-events: none;
      display: none;
      z-index: 1000;
    }
    .resize-handle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #2196F3;
      border-radius: 50%;
      pointer-events: all;
    }
    .handle-tl { top: -5px; left: -5px; cursor: nwse-resize; }
    .handle-t  { top: -5px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
    .handle-tr { top: -5px; right: -5px; cursor: nesw-resize; }
    .handle-l  { top: 50%; left: -5px; transform: translateY(-50%); cursor: ew-resize; }
    .handle-r  { top: 50%; right: -5px; transform: translateY(-50%); cursor: ew-resize; }
    .handle-bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
    .handle-b  { bottom: -5px; left: 50%; transform: translateY(-50%); cursor: ns-resize; }
    .handle-br { bottom: -5px; right: -5px; cursor: nwse-resize; }

    /* 子卡片系统样式 */
    .sub-card-group {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      position: relative;
      background: var(--bg-panel);
    }
    .sub-group-sort {
      position: absolute;
      right: 10px;
      bottom: 10px;
      display: flex;
      gap: 4px;
      display: none;
    }
    body.edit-mode .sub-group-sort {
      display: flex;
    }
    .sub-card-grid {
      display: grid;
      grid-template-columns: repeat(4, 168px);
      gap: 12px;
      margin-top: 10px;
      justify-content: space-between;
    }
    .sub-card {
      width: 168px !important;
      background: var(--bg-card);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      transition: 0.2s;
      cursor: pointer;
      border: 1px solid var(--border-color);
      position: relative;
      z-index: 1;
    }
    .sub-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 10px var(--shadow-color);
      z-index: 10;
    }
    .sub-card.active {
      border: 2px solid var(--primary);
    }
    .sub-card img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .sub-card .name {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sub-card .desc {
      font-size: 11px;
      color: var(--text-second);
      margin-bottom: 6px;
    }
    .sub-card .edit-ctrl {
      display: none;
      margin-top: 4px;
      gap: 4px;
      justify-content: center;
    }
    body.edit-mode .sub-card .edit-ctrl {
      display: flex;
    }
    .sub-card .edit-ctrl button {
      font-size: 11px;
      padding: 2px 5px;
      border: none;
      border-radius: 3px;
      background: var(--border-color);
      color: var(--text-main);
      cursor: pointer;
    }
    
    /* 编辑模式控制按钮显示 */
    #edit-detail, #edit-sub-detail {
      display: none;
    }
    body.edit-mode #edit-detail,
    body.edit-mode #edit-sub-detail {
      display: inline-block;
    }

    /* 子卡片拖拽手柄 */
    .sub-drag-handle {
      position: absolute;
      left: 6px;
      top: 6px;
      font-size: 16px;
      cursor: grab;
      color: var(--text-second);
      display: none;
      user-select: none;
    }
    body.edit-mode .sub-drag-handle {
      display: block;
    }

    /* 富文本工具栏样式 */
    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .toolbar-btn {
      padding: 4px 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-panel);
      color: var(--text-main);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }
    .toolbar-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .toolbar-select {
      padding: 4px 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-panel);
      color: var(--text-main);
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .toolbar-color-box {
      position: relative;
    }
    .color-panel {
      position: absolute;
      top: 100%;
      left: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      z-index: 1000;
      display: none;
      box-shadow: 0 2px 8px var(--shadow-color);
    }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(8, 20px);
      gap: 4px;
      margin: 4px 0;
    }
    .color-item {
      width: 20px;
      height: 20px;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid var(--border-color);
    }
    .link-input-panel {
      position: absolute;
      top: 100%;
      left: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      z-index: 1000;
      display: none;
      box-shadow: 0 2px 8px var(--shadow-color);
    }
    .link-input {
      width: 200px;
      padding: 4px;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .watermark-panel {
      position: absolute;
      top: 100%;
      left: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      z-index: 1000;
      display: none;
      width: 260px;
      box-shadow: 0 2px 8px var(--shadow-color);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="search-wrapper">
      <input class="search-box" id="searchInput" placeholder="搜索软件名称 / 别名 / 描述..." autocomplete="off">
      <div class="search-clear" id="searchClear">×</div>
    </div>
    <button class="theme-btn" id="themeBtn">暗黑模式</button>
    <button class="export-btn" id="exportBtn">导出代码</button>
    <button class="edit-btn" id="editBtn">编辑</button>
  </div>

  <div class="nav-menu" id="navMenu">
    <div class="nav-item active" data-cate="design" draggable="true">
      <span class="drag-handle">⋮</span>
      <span class="nav-text">设计类</span>
      <div class="nav-ctrl">
        <button class="nav-edit">编辑</button>
        <button class="nav-add">新增</button>
        <button class="nav-del">移除</button>
      </div>
    </div>
    <div class="nav-item" data-cate="develop" draggable=true>
      <span class="drag-handle">⋮</span>
      <span class="nav-text">开发类</span>
      <div class="nav-ctrl">
        <button class="nav-edit">编辑</button>
        <button class="nav-add">新增</button>
        <button class="nav-del">移除</button>
      </div>
    </div>
    <div class="nav-item" data-cate="tool" draggable=true>
      <span class="drag-handle">⋮</span>
      <span class="nav-text">工具类</span>
      <div class="nav-ctrl">
        <button class="nav-edit">编辑</button>
        <button class="nav-add">新增</button>
        <button class="nav-del">移除</button>
      </div>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="category-title" id="cate-design">设计类</div>
    <div class="content" id="content-design">

    function saveAllData() {
      const navItems = Array.from(document.querySelectorAll('.nav-item')).map(item => ({
        cate: item.dataset.cate,
        text: item.querySelector('.nav-text').innerText
      }));
      const cards = Array.from(document.querySelectorAll('.card')).map(card => ({
        cate: card.dataset.cate,
        name: card.dataset.name,
        alias: card.dataset.alias || '',
        img: card.dataset.img,
        html: card.dataset.html || '',
        desc: card.querySelector('.desc').innerText,
        linkHref: card.querySelector('.link').dataset.href || '',
        linkTxt: card.querySelector('.link').innerText || '',
        subgroups: card.dataset.subgroups || '[]'
      }));
      localStorage.setItem('softLibNav', JSON.stringify(navItems));
      localStorage.setItem('softLibCards', JSON.stringify(cards));
      alert('已自动保存所有修改！刷新不会丢失～');
    }

    function loadAllData() {
      const navData = localStorage.getItem('softLibNav');
      const cardData = localStorage.getItem('softLibCards');
      if (!navData || !cardData) return;

      const navMenu = document.getElementById('navMenu');
      const wrapper = document.querySelector('.content-wrapper');
      navMenu.innerHTML = '';
      wrapper.innerHTML = '';

      JSON.parse(navData).forEach(item => {
        const nav = document.createElement('div');
        nav.className = 'nav-item';
        nav.draggable = true;
        nav.dataset.cate = item.cate;
        nav.innerHTML = `<span class="drag-handle">⋮</span><span class="nav-text">${item.text}</span><div class="nav-ctrl"><button class="nav-edit">编辑</button><button class="nav-add">新增</button><button class="nav-del">移除</button></div>`;
        navMenu.appendChild(nav);

        const title = document.createElement('div');
        title.className = 'category-title';
        title.id = `cate-${item.cate}`;
        title.innerText = item.text;
        wrapper.appendChild(title);

        const content = document.createElement('div');
        content.className = 'content';
        content.id = `content-${item.cate}`;
        wrapper.appendChild(content);
      });

      JSON.parse(cardData).forEach(data => {
        const content = document.getElementById(`content-${data.cate}`);
        if (!content) return;
        const card = document.createElement('div');
        card.className = 'card';
        card.draggable = true;
        card.dataset.cate = data.cate;
        card.dataset.name = data.name;
        card.dataset.alias = data.alias;
        card.dataset.img = data.img;
        card.dataset.html = data.html;
        card.dataset.subgroups = data.subgroups;
        card.innerHTML = `
          <span class="drag-handle">⋮</span>
          <img src="${data.img}" alt="图标">
          <div class="name">${data.name}</div>
          <div class="desc">${data.desc}</div>
          <div class="link-wrap">
            <span class="link" data-href="${data.linkHref}">${data.linkTxt}</span>
            <span class="copy-btn">复制链接</span>
          </div>
          <div class="edit-ctrl">
            <button class="copy-card">复制</button>
            <button class="edit-card">编辑</button>
            <button class="add-card">新增</button>
            <button class="del-card">移除</button>
          </div>
        `;
        content.appendChild(card);
        bindCardEvents(card);
      });

      refreshCardList();
      rebindNavAll();
      updateElements();
      setDefaultActiveMenu();
      activeMenuByScroll();
    }

    function hasAnyModalOpen() {
      const detailModal = document.getElementById('detailModal');
      const subDetailModal = document.getElementById('subDetailModal');
      const adminModal = document.getElementById('adminModal');
      const errorModal = document.getElementById('errorModal');
      const editModal = document.getElementById('editModal');
      return detailModal.style.display === 'flex' ||
             subDetailModal.style.display === 'flex' ||
             adminModal.style.display === 'flex' ||
             errorModal.style.display === 'flex' ||
             editModal.style.display === 'flex';
    }

    function initImageResizer() {
      const editor = document.getElementById('editorArea');
      if (!editor) return;

      if (resizer && resizer.parentNode) {
        resizer.parentNode.removeChild(resizer);
      }
      resizer = null;
      activeImg = null;

      resizer = document.createElement('div');
      resizer.className = 'img-resizer';
      const handles = ['tl','t','tr','l','r','bl','b','br'];
      handles.forEach(h => {
        const handle = document.createElement('div');
        handle.className = `resize-handle handle-${h}`;
        resizer.appendChild(handle);
      });
      editor.appendChild(resizer);

      editor.querySelectorAll('img').forEach(img => {
        img.onclick = (e) => {
          e.stopPropagation();
          if (activeImg === img) {
            showResizer(img);
          } else {
            clearActiveImg();
            activeImg = img;
            img.classList.add('editor-img-active');
          }
        };
      });

      editor.onclick = (e) => {
        if (!e.target.closest('img')) {
          clearActiveImg();
          hideResizer();
        }
      };
    }

    function showResizer(img) {
      const rect = img.getBoundingClientRect();
      const editorRect = document.getElementById('editorArea').getBoundingClientRect();
      resizer.style.display = 'block';
      resizer.style.left = rect.left - editorRect.left + 'px';
      resizer.style.top = rect.top - editorRect.top + 'px';
      resizer.style.width = img.offsetWidth + 'px';
      resizer.style.height = img.offsetHeight + 'px';
      startRatio = img.naturalWidth / img.naturalHeight;

      const handles = resizer.querySelectorAll('.resize-handle');
      handles.forEach(handle => {
        handle.onmousedown = (e) => {
          e.stopPropagation();
          startX = e.clientX;
          startY = e.clientY;
          startWidth = img.offsetWidth;
          startHeight = img.offsetHeight;

          document.onmousemove = (e) => {
            let dx = e.clientX - startX;
            let dy = e.clientY - startY;
            if (handle.classList.contains('handle-l') || handle.classList.contains('handle-r')) dx *= 2;
            if (handle.classList.contains('handle-t') || handle.classList.contains('handle-b')) dy *= 2;
            
            let w = startWidth + dx;
            let h = w / startRatio;
            if (w < 50) w = 50;
            if (h < 50) h = 50;
            
            img.style.width = w + 'px';
            img.style.height = 'auto';
            resizer.style.width = w + 'px';
            resizer.style.height = img.offsetHeight + 'px';
          };

          document.onmouseup = () => {
            document.onmousemove = null;
            document.onmouseup = null;
          };
        };
      });
    }

    function hideResizer() {
      if (resizer) resizer.style.display = 'none';
    }

    function clearActiveImg() {
      if (activeImg) {
        activeImg.classList.remove('editor-img-active');
        activeImg = null;
      }
    }

    function initImageUpload() {
      const upload = document.getElementById('imgUpload');
      const preview = document.getElementById('imgPreview');
      const urlInput = document.getElementById('cardImg');
      if (!upload) return;
      upload.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        const name = file.name.replace(/\s+/g, '_');
        urlInput.value = `images/${name}`;
        upload.value = '';
      };
    }

    function getPinyinFirstLetter(str) {
      const pinyinMap = {'一':'Y','二':'E','三':'S','四':'S','五':'W','六':'L','七':'Q','八':'B','九':'J','十':'S'};
      const hanReg = /[\u4e00-\u9fa5]/g;
      let result = "";
      for(let char of str){
        if(/[a-zA-Z]/g.test(char)) result += char.toUpperCase();
        else if(hanReg.test(char)) result += pinyinMap[char] || char;
      }
      return result;
    }

    function setAutoTheme() {
      if (manualToggle) return;
      const now = new Date();
      const hour = now.getHours();
      const isLightTime = (hour >= 6 && hour < 18);
      const themeBtn = document.getElementById('themeBtn');
      if (isLightTime) {
        document.documentElement.classList.remove('dark-mode');
        themeBtn.innerText = '暗黑模式';
      } else {
        document.documentElement.classList.add('dark-mode');
        themeBtn.innerText = '浅色模式';
      }
    }
    setAutoTheme();
    setInterval(setAutoTheme, 60000);

    let navItems = document.querySelectorAll('.nav-item');
    function updateElements() { navItems = document.querySelectorAll('.nav-item'); categoryTitles = document.querySelectorAll('.category-title'); }
    function setDefaultActiveMenu() { updateElements(); navItems.forEach(item => item.classList.remove('active')); if (navItems.length > 0) navItems[0].classList.add('active'); }
    
    function activeMenuByScroll() {
      updateElements();
      const scrollTop = window.scrollY + 80 + 160;
      let current = '';
      categoryTitles.forEach(title => {
        if (scrollTop >= title.offsetTop) current = title.id.replace('cate-', '');
      });
      navItems.forEach(item => {
        item.classList.remove('active');
        if (item.dataset.cate === current) item.classList.add('active');
      });
    }

    function bindNavClick() {
      navItems.forEach(item => {
        item.onclick = function () {
          navItems.forEach(i => i.classList.remove('active'));
          this.classList.add('active');
          const target = document.getElementById(`cate-${this.dataset.cate}`);
          if (target) {
            window.scrollTo({ top: target.offsetTop - 76, behavior: 'smooth' });
          }
        };
      });
    }
    bindNavClick();
    window.addEventListener('scroll', activeMenuByScroll);
    window.addEventListener('load', () => { 
      loadAllData();
      updateElements(); 
      setDefaultActiveMenu(); 
      activeMenuByScroll(); 
    });

    const editBtn = document.getElementById('editBtn');
    editBtn.addEventListener('click', () => { 
      if (!isAdmin) { 
        document.getElementById('adminModal').style.display = 'flex'; 
      } else { 
        isAdmin = false; 
        document.body.classList.remove('edit-mode'); 
        editBtn.innerText = '编辑'; 
        editBtn.style.background = '#999';
        document.getElementById('add-sub-group').style.display = 'none';
        saveAllData();
      } 
    });
    function closeAdminModal() { document.getElementById('adminModal').style.display = "none"; }
    function checkAdmin() { const pwd = document.getElementById('adminPwd').value.trim(); if (pwd === correctPwd) { isAdmin = true; document.body.classList.add('edit-mode'); editBtn.innerText = '退出编辑'; editBtn.style.background = '#e63946'; document.getElementById('add-sub-group').style.display = 'inline-block'; closeAdminModal(); } else { document.getElementById('errorModal').style.display = "flex"; } }
    function closeError() { document.getElementById('errorModal').style.display = "none"; }

    let allCards = document.querySelectorAll('.card');
    function refreshCardList() { allCards = document.querySelectorAll('.card'); }
    
    function refreshDetail(card) { 
      detailIcon.src = card.dataset.img; 
      detailTitle.innerText = card.querySelector('.name').innerText;
      const descText = card.querySelector('.desc').innerText;
      detailDesc.innerText = descText;
      detailDesc.style.display = descText ? 'block' : 'none';
      const linkEl = card.querySelector('.link');
      const linkHref = linkEl.dataset.href || '';
      const linkTxt = linkEl.innerText || '';
      detailLink.dataset.href = linkHref;
      detailLink.innerText = linkTxt;
      detailLinkWrap.style.display = linkTxt ? 'block' : 'none';
      detailContent.innerHTML = card.dataset.html || defaultHtml; 
      renderSubGroups(card);
    }

    function renderSubGroups(card) {
      const content = document.getElementById('detailContent');
      const existingGroups = content.querySelectorAll('.sub-card-group');
      existingGroups.forEach(g => g.remove());

      let groups = [];
      try { groups = JSON.parse(card.dataset.subgroups || '[]'); } catch (e) {}
      groups.forEach((group, gIdx) => {
        const groupEl = document.createElement('div');
        groupEl.className = 'sub-card-group';
        groupEl.dataset.index = gIdx;

        const sortEl = document.createElement('div');
        sortEl.className = 'sub-group-sort';
        sortEl.innerHTML = `
          <button class="sub-group-up">↑</button>
          <button class="sub-group-down">↓</button>
        `;
        groupEl.appendChild(sortEl);

        const grid = document.createElement('div');
        grid.className = 'sub-card-grid';
        groupEl.appendChild(grid);

        group.cards.forEach((sub, sIdx) => {
          const subCard = createSubCard(sub, gIdx, sIdx);
          grid.appendChild(subCard);
        });

        content.appendChild(groupEl);
        bindSubGroupEvents(groupEl, card);
      });
    }

    function createSubCard(data, gIdx, sIdx) {
      const sub = document.createElement('div');
      sub.className = 'sub-card';
      sub.dataset.gidx = gIdx;
      sub.dataset.sidx = sIdx;
      sub.draggable = true;
      sub.innerHTML = `
        <span class="sub-drag-handle">⋮</span>
        <img src="${data.img}" alt="图标">
        <div class="name">${data.name}</div>
        <div class="desc">${data.desc || ''}</div>
        <div class="link-wrap">
          <span class="link" data-href="${data.linkHref || ''}">${data.linkTxt || ''}</span>
          <span class="copy-btn">复制链接</span>
        </div>
        <div class="edit-ctrl">
          <button class="sub-copy">复制</button>
          <button class="sub-edit">编辑</button>
          <button class="sub-add">新增</button>
          <button class="sub-del">移除</button>
        </div>
      `;
      bindSubCardEvents(sub);
      return sub;
    }

    function bindSubDrag(sub) {
      sub.addEventListener('dragstart', (e) => {
        if (!isAdmin) return;
        draggingSub = sub;
        sub.style.opacity = '0.5';
        e.dataTransfer.effectAllowed = 'move';
      });
      sub.addEventListener('dragend', () => {
        draggingSub = null;
        document.querySelectorAll('.sub-card').forEach(s => s.style.opacity = '1');
      });
      sub.addEventListener('dragover', (e) => {
        if (!draggingSub || draggingSub === sub) {
          e.preventDefault();
          return;
        }
        e.preventDefault();
      });
      sub.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!draggingSub || draggingSub === sub) return;
        
        const fromG = parseInt(draggingSub.dataset.gidx);
        const fromS = parseInt(draggingSub.dataset.sidx);
        const toG = parseInt(sub.dataset.gidx);
        const toS = parseInt(sub.dataset.sidx);
        const card = selectedCard;
        let groups = JSON.parse(card.dataset.subgroups);
        
        const moved = groups[fromG].cards.splice(fromS, 1)[0];
        if (fromG === toG) {
          groups[toG].cards.splice(toS, 0, moved);
        } else {
          groups[toG].cards.splice(toS, 0, moved);
          if (groups[fromG].cards.length === 0) groups.splice(fromG, 1);
        }
        
        card.dataset.subgroups = JSON.stringify(groups);
        refreshDetail(card);
      });
    }

    function bindSubCardEvents(sub) {
      bindSubDrag(sub);
      const linkWrap = sub.querySelector('.link-wrap');
      const link = linkWrap.querySelector('.link');
      const copy = linkWrap.querySelector('.copy-btn');
      link.onclick = (e) => { e.stopPropagation(); if(link.dataset.href) window.open(link.dataset.href, '_blank'); };
      copy.onclick = (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(link.dataset.href || '').then(() => {
          copy.innerText = '已复制';
          setTimeout(() => copy.innerText = '复制链接', 1500);
        });
      };

      sub.onclick = (e) => {
        if(e.target.closest('.edit-ctrl') || e.target.closest('.link-wrap') || e.target.closest('.sub-drag-handle')) return;
        e.stopPropagation();
        document.querySelectorAll('.sub-card').forEach(s => s.classList.remove('active'));
        sub.classList.add('active');
        currentSubCard = sub;
      };

      sub.ondblclick = (e) => {
        e.stopPropagation();
        openSubDetail(sub);
      };

      const copyBtn = sub.querySelector('.sub-copy');
      copyBtn.onclick = (e) => {
        e.stopPropagation();
        const gIdx = parseInt(sub.dataset.gidx);
        const sIdx = parseInt(sub.dataset.sidx);
        const card = selectedCard;
        let groups = JSON.parse(card.dataset.subgroups);
        const source = groups[gIdx].cards[sIdx];
        const newSub = JSON.parse(JSON.stringify(source));
        groups[gIdx].cards.splice(sIdx + 1, 0, newSub);
        card.dataset.subgroups = JSON.stringify(groups);
        refreshDetail(card);
      };

      const editBtn = sub.querySelector('.sub-edit');
      editBtn.onclick = (e) => {
        e.stopPropagation();
        const gIdx = parseInt(sub.dataset.gidx);
        const sIdx = parseInt(sub.dataset.sidx);
        const card = selectedCard;
        let groups = JSON.parse(card.dataset.subgroups);
        const data = groups[gIdx].cards[sIdx];
        currentSubCard = sub;
        currentEditTarget = { type: 'sub', card, gIdx, sIdx };

        editTitle.innerText = '编辑子卡片';
        editBody.innerHTML = `
          <div class="img-upload-area">
            <label>图标：</label>
            <input type="file" id="imgUpload" accept="image/*">
            <img id="imgPreview" src="${data.img}" style="display:block;">
          </div>

        [groups[idx], groups[idx-1]] = [groups[idx-1], groups[idx]];
        card.dataset.subgroups = JSON.stringify(groups);

      down.onclick = () => {
        let groups = JSON.parse(card.dataset.subgroups);

        syncContentOrderByNav();
        setDefaultActiveMenu();
        activeMenuByScroll();
      });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (dragNavItem && dragNavItem !== item) item.classList.add('drag-over');
      });
      item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
      item.addEventListener('drop', (e) => {
        e.preventDefault();
        if (dragNavItem && dragNavItem !== item) {
          const navMenu = document.getElementById('navMenu');
          const rect = item.getBoundingClientRect();
          const before = e.clientY < rect.top + rect.height / 2;
          if (before) navMenu.insertBefore(dragNavItem, item);
          else navMenu.insertBefore(dragNavItem, item.nextSibling);
        }
        item.classList.remove('drag-over');
      });
    }

      });

              linkElement.target = '_blank';
            }
          }
        }
      });

      btn.style.opacity = '0.5';
      btn.style.pointerEvents = 'none';

      setTimeout(() => {
        editor.focus();
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(editor);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
        editorHasFocused = true;
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';

        editorHasFocused = true;

        editorHasFocused = false;

        e.preventDefault();

          }

    // 子卡片详情编辑
    document.getElementById('edit-sub-detail').onclick = () => {

      const sIdx = parseInt(currentSubCard.dataset.sidx);
      const groups = JSON.parse(selectedCard.dataset.subgroups);
      const html = groups[gIdx].cards[sIdx].html || defaultHtml;
      currentEditTarget = { type: 'subDetail' };
      editTitle.innerText = '编辑子卡片详情';
      editBody.innerHTML = `
        <div class="detail-editor-wrapper">
          <div class="detail-editor-header">
            <div class="upload-tip">可粘贴/上传图片</div>
            ${getToolbarHtml()}
          </div>
          <div class="detail-editor-body">
            <div class="editor-area" id="editorArea" contenteditable>${html}</div>
            <input type="file" id="imgFile" style="display:none">
          </div>
          <div class="detail-editor-footer">
            <button type="button" class="save-btn" id="insertImgBtn">上传图片</button>
          </div>
        </div>
      `;
      editModal.style.display = 'flex';

      const editor = document.getElementById('editorArea');
      const btn = document.getElementById('insertImgBtn');
      const imgInput = document.getElementById('imgFile');
      btn.style.opacity = '0.5';
      btn.style.pointerEvents = 'none';

      setTimeout(() => {
        editor.focus();
        const range = document.createRange();
        const sel = window.getSelection();

        sel.removeAllRanges();
        sel.addRange(range);
        editorHasFocused = true;
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
        initImageResizer();
        bindToolbarEvents();
      }, 100);

      editor.addEventListener('focus', () => {
        editorHasFocused = true;
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
      });
      editor.addEventListener('blur', () => {
        editorHasFocused = false;
        btn.style.opacity = '0.5';
        btn.style.pointerEvents = 'none';
      });

      btn.onmousedown = (e) => {
        e.preventDefault();
        if (!editorHasFocused) {
          alert("请先点击编辑内容区域！");
          return;
        }
        imgInput.click();
      };

      imgInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = document.createElement('img');
          img.src = ev.target.result;
          img.style.maxWidth = '100%';
          const sel = window.getSelection();
          if (sel.rangeCount > 0) {
            const range = sel.getRangeAt(0);
            range.insertNode(img);
            range.setStartAfter(img);
            range.setEndAfter(img);
            sel.removeAllRanges();
            sel.addRange(range);
          } else {
            editor.appendChild(img);
          }
          initImageResizer();
        };
        reader.readAsDataURL(file);
        imgInput.value = '';
      };
    };

    document.getElementById('closeDetail').onclick = () => { detailModal.style.display='none'; detailShow = false; };
    document.getElementById('closeSubDetail').onclick = () => { document.getElementById('subDetailModal').style.display = 'none'; };
    document.getElementById('cancelEdit').onclick = () => { editModal.style.display = 'none'; currentEditTarget=null; };

    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
      manualToggle = true;
      const html = document.documentElement;
      html.classList.toggle('dark-mode');
      themeBtn.innerText = html.classList.contains('dark-mode') ? '浅色模式' : '暗黑模式';
    });

    document.getElementById('exportBtn').onclick = async () => {
      const html = document.documentElement.outerHTML;
      await navigator.clipboard.writeText(html);
      alert('✅ 完整代码已复制到剪贴板！');
    };

    searchInput.addEventListener('input', function(){
      const keyword = this.value.trim().toLowerCase();
      const keywordUpper = this.value.trim().toUpperCase();
      document.querySelectorAll('.content').forEach(box => {
        let hasShow = false;
        box.querySelectorAll('.card').forEach(card => {
          const name = card.dataset.name.toLowerCase();
          const alias = (card.dataset.alias || '').toLowerCase();
          const desc = card.querySelector('.desc').innerText.toLowerCase();
          const namePinyin = getPinyinFirstLetter(card.dataset.name).toUpperCase();
          const aliasPinyin = getPinyinFirstLetter(card.dataset.alias || '').toUpperCase();
          const descPinyin = getPinyinFirstLetter(desc).toUpperCase();
          const match = name.includes(keyword) || alias.includes(keyword) || desc.includes(keyword) || namePinyin.includes(keywordUpper) || aliasPinyin.includes(keywordUpper) || descPinyin.includes(keywordUpper);
          card.classList.toggle('hide', !match);
          if(match) hasShow = true;
        });
        let emptyTip = box.querySelector('.content-empty');
        if(!hasShow && !emptyTip){
          let tip = document.createElement('div');
          tip.className = 'content-empty';
          tip.innerText = '未找到匹配内容';
          box.appendChild(tip);
        }
        if(hasShow && emptyTip){
          emptyTip.remove();
        }
      });
    });
  </script>
